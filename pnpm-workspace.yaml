packages:
  - core
  - service
  - test
  - web

allowBuilds:
  '@google/genai': false
  '@nkzw/mdx-editor': true
  '@swc/core': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  native-keymap: true
  node-pty: true
  protobufjs: false
  sharp: true
  workerd: true
blockExoticSubdeps: false
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  - '@nkzw/*'
  - void-fate
  - '@void/*'
  - react-fate
  - void
  - '@pierre/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6bc2d240a024170c08fbc831f0c201c162afd22e
  vite-plus: 0.0.0-commit.6bc2d240a024170c08fbc831f0c201c162afd22e
nodeLinker: hoisted
onlyBuiltDependencies:
  - '@nkzw/mdx-editor'
  - '@swc/core'
  - electron
  - electron-winstaller
  - unrs-resolver
overrides:
  extract-zip>yauzl: ^3.4.0
  vite@*: 'catalog:'
patchedDependencies:
  native-keymap@3.3.9: patches/native-keymap@3.3.9.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
